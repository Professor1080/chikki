<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEURO-3D // Live AI Avatar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Official Spline Viewer -->
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.28/build/spline-viewer.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; overflow: hidden; background: #05050a; }
        
        /* Dynamic 3D Stage Animations for Fast Reactions */
        #spline-stage {
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
        }
        .state-listening {
            transform: scale(1.06);
            filter: drop-shadow(0 0 35px rgba(239, 68, 68, 0.6));
        }
        .state-thinking {
            animation: pulse-think 0.8s infinite alternate ease-in-out;
            filter: drop-shadow(0 0 40px rgba(168, 85, 247, 0.8)) hue-rotate(25deg);
        }
        .state-speaking {
            animation: talk-bounce 0.18s infinite alternate ease-in-out;
            filter: drop-shadow(0 0 45px rgba(6, 182, 212, 0.85));
        }
        @keyframes pulse-think {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.05) rotate(1deg); }
        }
        @keyframes talk-bounce {
            0% { transform: scale(1.03) translateY(0px); }
            100% { transform: scale(1.06) translateY(-8px); }
        }

        /* Audio Equalizer Bars */
        .eq-bar {
            width: 4px;
            background: linear-gradient(to top, #06b6d4, #ec4899);
            border-radius: 9999px;
            transition: height 0.08s ease;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.4); border-radius: 10px; }
    </style>
</head>
<body class="relative w-screen h-screen select-none text-white">

    <!-- Ambient Cyberpunk Background Glows -->
    <div id="ambient-glow" class="fixed inset-0 pointer-events-none transition-all duration-700 bg-[radial-gradient(circle_at_35%_50%,rgba(124,58,237,0.18),transparent_65%)]"></div>

        <spline-viewer url="https://prod.spline.design/6Wq1Q7YGyM-iab9i/scene.splinecode" class="w-full h-full"></spline-viewer>

    </div>

            </div>
        </div>

        <!-- 20-Bar Live Audio Equalizer -->
        <div id="equalizer" class="flex items-end gap-1 h-10 px-4 py-2 bg-black/50 backdrop-blur-md border border-white/10 rounded-xl w-fit opacity-30 transition-opacity duration-300">
            <div class="eq-bar h-2"></div><div class="eq-bar h-3"></div><div class="eq-bar h-2"></div><div class="eq-bar h-4"></div>
            <div class="eq-bar h-2"></div><div class="eq-bar h-5"></div><div class="eq-bar h-3"></div><div class="eq-bar h-2"></div>

            <div class="eq-bar h-5"></div><div class="eq-bar h-3"></div><div class="eq-bar h-2"></div><div class="eq-bar h-4"></div>
        </div>

        <!-- HUD Header + API Brain Config -->

            <div class="flex items-center gap-2.5">
                <div class="h-9 w-9 rounded-xl bg-gradient-to-tr from-cyan-500 to-fuchsia-600 flex items-center justify-center font-bold text-sm shadow-lg">AI</div>
                <div>
                    <h1 class="font-bold text-sm tracking-wide text-white flex items-center gap-1.5">
                        A
