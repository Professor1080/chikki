<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice-Enabled 3D AI Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.28/build/spline-viewer.js"></script>
</head>
<body class="bg-purple-950 text-white h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- Left: 3D Character Viewport -->
    <div class="w-full md:w-3/5 h-1/2 md:h-full relative bg-gradient-to-br from-purple-900 to-pink-900 border-r border-purple-800">
        <spline-viewer url="https://prod.spline.design/6Wq1Q7YGyM-iab9i/scene.splinecode"></spline-viewer>
        <div class="absolute top-4 left-4 bg-black/60 backdrop-blur-md px-4 py-2 rounded-full border border-pink-500/50 text-xs font-bold tracking-wider text-pink-400 uppercase animate-pulse">
            🎙️ Voice Mode Active
        </div>
    </div>

    <!-- Right: Voice & Chat Interface -->
    <div class="w-full md:w-2/5 h-1/2 md:h-full flex flex-col bg-gray-950">
        <!-- Header -->
        <header class="p-4 border-b border-purple-900/50 bg-purple-950/50 backdrop-blur flex justify-between items-center">
            <div>
                <h1 class="text-base font-bold text-pink-400">VoiceBot 3000</h1>
                <p class="text-xs text-purple-300">Speak or type to chat live</p>
            </div>
            <span id="status-dot" class="h-3 w-3 bg-red-500 rounded-full"></span>
        </header>

        <!-- Chat Messages Area -->
        <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-4">
            <div class="flex items-start space-x-3">
                <div class="bg-pink-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-xs shadow-lg">3D</div>
                <div class="bg-purple-900/80 border border-purple-700/50 p-3 rounded-2xl max-w-[85%] text-sm text-purple-100">
                    Hey! Click the microphone button below and talk to me, or type your question. I'll answer and speak back to you!
                </div>
            </div>
        </div>

        <!-- Input & Voice Controls -->
        <div class="p-4 border-t border-purple-900/50 bg-purple-950/50 space-y-2">
            <div class="flex gap-2">
                <button 
                    id="mic-btn" 
                    type="button" 
                    class="bg-red-600 hover:bg-red-500 text-white px-4 py-2.5 rounded-xl text-sm font-bold shadow-lg transition flex items-center gap-2"
                >
                    🎤 <span id="mic-text">Start Mic</span>
                </button>
                <input 
                    type="text" 
                    id="user-input" 
                    placeholder="Or type a message here..." 
                    class="flex-1 bg-purple-900/40 border border-purple-700/50 rounded-xl px-4 py-2.5 text-sm text-white placeholder-purple-400 focus:outline-none focus:border-pink-500 transition"
                >
                <button 
                    id="send-btn" 
                    type="button" 
                    class="bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white px-4 py-2.5 rounded-xl text-sm font-bold shadow-lg transition"
                >
                    Send
                </button>
            </div>
        </div>
    </div>

    <!-- Voice & Logic Script -->
    <script>
        const input = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const micBtn = document.getElementById('mic-btn');
        const micText = document.getElementById('mic-text');
        const messages = document.getElementById('chat-messages');
        const statusDot = document.getElementById('status-dot');

        // Text-to-Speech Function (Character speaks out loud)
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop previous speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Handle AI Responses (Simulated smart responses or integration point)
        function handleUserMessage(text) {
            if (!text.trim()) return;

            // Append User Message
            messages.innerHTML += `
                <div class="flex items-start justify-end space-x-3">
                    <div class="bg-purple-800/80 border border-purple-600/50 p-3 rounded-2xl max-w-[85%] text-sm text-purple-100">${escapeHtml(text)}</div>
                    <div class="bg-purple-700 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-xs">You</div>
                </div>
            `;
            input.value = '';
            messages.scrollTop = messages.scrollHeight;

            // Generate intelligent-sounding mock response (or you can hook up an API key here)
            setTimeout(() => {
                let reply = "That's a fascinating question! Since I'm running as a lightweight client demo, I processed your input: '" + text + "'. To connect me to a live LLM brain like Gemini, you can drop in an API key later!";
                
                if(text.toLowerCase().includes('hello') || text.toLowerCase().includes('hi')) {
                    reply = "Hello Professor! Systems are online and fully operational.";
                } else if(text.toLowerCase().includes('iit')) {
                    reply = "Ah, greetings from IIT Patna! Let's get this code working.";
                }

                messages.innerHTML += `
                    <div class="flex items-start space-x-3">
                        <div class="bg-pink-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-xs shadow-lg">3D</div>
                        <div class="bg-purple-900/80 border border-purple-700/50 p-3 rounded-2xl max-w-[85%] text-sm text-purple-100">
                            ${escapeHtml(reply)}
                        </div>
                    </div>
                `;
                messages.scrollTop = messages.scrollHeight;
                speakText(reply); // Character speaks back!
            }, 800);
        }

        sendBtn.addEventListener('click', () => handleUserMessage(input.value));
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleUserMessage(input.value);
        });

        // Browser Speech Recognition (Voice Input)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;

            micBtn.addEventListener('click', () => {
                try {
                    recognition.start();
                    micText.innerText = "Listening...";
                    statusDot.className = "h-3 w-3 bg-green-500 rounded-full animate-ping";
                } catch(e) {
                    recognition.stop();
                }
            });

            recognition.onresult = (event) => {
                const speechToText = event.results[0][0].transcript;
                micText.innerText = "Start Mic";
                statusDot.className = "h-3 w-3 bg-green-500 rounded-full";
                handleUserMessage(speechToText);
            };

            recognition.onerror = () => {
                micText.innerText = "Start Mic";
                statusDot.className = "h-3 w-3 bg-red-500 rounded-full";
            };
            
            recognition.onend = () => {
                micText.innerText = "Start Mic";
                statusDot.className = "h-3 w-3 bg-green-500 rounded-full";
            };
        } else {
            micBtn.style.display = 'none'; // Hide if browser doesn't support mic
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
