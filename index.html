<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Assistant</title>
    <!-- Tailwind CSS for fast styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Spline Viewer Script -->
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.28/build/spline-viewer.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- Left: 3D Character Viewport -->
    <div class="w-full md:w-1/2 h-1/2 md:h-full relative bg-gray-900 border-r border-gray-800">
        <!-- REPLACE THE URL BELOW WITH YOUR ACTUAL SPLINE SCENE URL -->
        <spline-viewer url="https://prod.spline.design/6Wq1Q7YGyM-iab9i/scene.splinecode"></spline-viewer>
    </div>

    <!-- Right: Chat Interface -->
    <div class="w-full md:w-1/2 h-1/2 md:h-full flex flex-col bg-gray-950">
        <!-- Header -->
        <header class="p-4 border-b border-gray-800 bg-gray-900/50 backdrop-blur">
            <h1 class="text-lg font-semibold text-indigo-400">AI Companion</h1>
            <p class="text-xs text-gray-400">Interactive 3D Assistant Demo</p>
        </header>

        <!-- Chat Messages Area -->
        <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-4">
            <div class="flex items-start space-x-3">
                <div class="bg-indigo-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-sm">3D</div>
                <div class="bg-gray-800 p-3 rounded-2xl max-w-[80%] text-sm text-gray-200">
                    Hello! I'm your interactive 3D assistant. How can I help you today?
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 border-t border-gray-800 bg-gray-900/50">
            <form id="chat-form" class="flex gap-2">
                <input 
                    type="text" 
                    id="user-input" 
                    placeholder="Type a message..." 
                    class="flex-1 bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-gray-100 focus:outline-none focus:border-indigo-500"
                    required
                >
                <button 
                    type="submit" 
                    class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition"
                >
                    Send
                </button>
            </form>
        </div>
    </div>

    <!-- Simple Chat Script -->
    <script>
        const form = document.getElementById('chat-form');
        const input = document.getElementById('user-input');
        const messages = document.getElementById('chat-messages');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (!text) return;

            // Append User Message
            messages.innerHTML += `
                <div class="flex items-start justify-end space-x-3">
                    <div class="bg-gray-800 p-3 rounded-2xl max-w-[80%] text-sm text-gray-200">${escapeHtml(text)}</div>
                    <div class="bg-gray-700 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-sm">You</div>
                </div>
            `;
            input.value = '';
            messages.scrollTop = messages.scrollHeight;

            // Simulate AI Response after 1 second
            setTimeout(() => {
                messages.innerHTML += `
                    <div class="flex items-start space-x-3">
                        <div class="bg-indigo-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-sm">3D</div>
                        <div class="bg-gray-800 p-3 rounded-2xl max-w-[80%] text-sm text-gray-200">
                            I received your message! (Connect me to an LLM API later for live intelligence).
                        </div>
                    </div>
                `;
                messages.scrollTop = messages.scrollHeight;
            }, 1000);
        });

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
